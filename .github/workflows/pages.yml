name: Deploy ScoutOffice

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # chaque lundi : nouvelle version amont ?
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scoutoffice-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Relever les versions amont
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            awk '/upstream:/{print $2}' apps.yml | sort -u | while read -r repo; do
              echo "$repo $(gh release view --repo "$repo" --json tagName --jq .tagName)"
            done
            for repo in excalidraw/excalidraw TiddlyWiki/TiddlyWiki5; do
              echo "$repo $(gh api "repos/$repo/commits/HEAD" --jq .sha | cut -c1-12)"
            done
          } > versions.new
          cat versions.new
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && cmp -s versions.new upstream-versions.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle version amont." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv versions.new upstream-versions.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upstream-versions.txt
            git diff --cached --quiet || { git commit -m "Versions amont mises à jour"; git push || true; }
          fi
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScoutOffice
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build browser notes and drawing apps
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          cp -a "$GITHUB_WORKSPACE/assets" "$GITHUB_WORKSPACE/build/assets"
          rm -rf "$RUNNER_TEMP/excalidraw" "$RUNNER_TEMP/tiddlywiki"
          git clone --depth 1 https://github.com/excalidraw/excalidraw.git "$RUNNER_TEMP/excalidraw"
          git clone --depth 1 https://github.com/TiddlyWiki/TiddlyWiki5.git "$RUNNER_TEMP/tiddlywiki"
          npm install --global yarn@1.22.22
          cd "$RUNNER_TEMP/excalidraw"
          yarn install --frozen-lockfile
          yarn --cwd excalidraw-app vite build --base=./
          mkdir -p "$GITHUB_WORKSPACE/build/Draw"
          cp -a excalidraw-app/build/. "$GITHUB_WORKSPACE/build/Draw/"
          cd "$RUNNER_TEMP/tiddlywiki"
          node ./tiddlywiki.js editions/fr-FR --build index
          mkdir -p "$GITHUB_WORKSPACE/build/Notes"
          cp editions/fr-FR/output/index.html "$GITHUB_WORKSPACE/build/Notes/index.html"
          cp "$GITHUB_WORKSPACE/assets/icons/TiddlyWiki.png" "$GITHUB_WORKSPACE/build/Notes/favicon.png"
          cp "$GITHUB_WORKSPACE/assets/styles/notes.css" "$GITHUB_WORKSPACE/build/Notes/notes.css"
          sed -i \
            -e '/<head>/a <link rel="icon" type="image/png" href="favicon.png">' \
            -e '/<head>/a <link rel="stylesheet" href="notes.css">' \
            "$GITHUB_WORKSPACE/build/Notes/index.html"
      - name: Relier Draw et Notes à ScoutHub
        run: |
          for d in Draw Notes; do
            find "build/$d" -maxdepth 1 -type f -name 'index.html' -exec sed -i               "s#</body>#<script src=\"/ScoutHub/scouthub-client.js\" data-app=\"$d\"></script></body>#" {} +
          done
      - name: Assemble portal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp index.html build/
          while read -r key display upstream_repo source_dir binary output_dir upstream_name asset_prefix icon; do
            [ "$key" = "-" ] && continue
            disp="${display//_/ }"
            release_dir="$RUNNER_TEMP/releases/$key"
            mkdir -p "$release_dir" "build/$output_dir"
            if ! gh release download --repo "$upstream_repo" --pattern "${asset_prefix}-web-*.zip" --dir "$release_dir" --clobber; then
              echo "::warning::Pas de version web pour $upstream_repo"; rm -rf "build/$output_dir"; continue
            fi
            archive="$(find "$release_dir" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            test -n "$archive"
            unzip -q "$archive" -d "$release_dir/unpacked"
            root="$(find "$release_dir/unpacked" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$root"
            cp -a "$root"/. "build/$output_dir"/
            [ "$icon" = "-" ] || cp "assets/icons/$icon" "build/$output_dir/favicon.png"
            find "build/$output_dir" -type f -name '*.html' -exec sed -i \
              -e "s/${upstream_name}/${disp}/g" \
              -e 's/<html lang="en">/<html lang="fr">/g' \
              -e 's/Loading /Chargement de /g' {} +
            if [ "$icon" != "-" ]; then
              find "build/$output_dir" -type f -name '*.html' -exec sed -i \
                '/<head>/a <link rel="icon" type="image/png" href="favicon.png">' {} +
            fi
            find "build/$output_dir" -type f -name '*.html' -exec sed -i               "s#</body>#<script src=\"/ScoutHub/scouthub-client.js\" data-app=\"$disp\"></script></body>#" {} +
          done < <(awk '/^- key:/{key=$3} /display_name:/{display=$2} /upstream:/{upstream=$2} /source_dir:/{source=$2} /binary:/{binary=$2} /output_dir:/{out=$2} /asset_prefix:/{prefix=$2} /icon:/{icon=$2} /upstream_name:/{name=$2; print key,display,upstream,source,binary,out,name,prefix,icon}' apps.yml)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
